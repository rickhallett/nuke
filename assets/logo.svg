<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <defs>
    <radialGradient id="cap" cx="45%" cy="40%" r="65%">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset=".55" stop-color="#ff7b54"/>
      <stop offset="1" stop-color="#c0392b"/>
    </radialGradient>
    <radialGradient id="stem" cx="50%" cy="20%" r="80%">
      <stop offset="0" stop-color="#ff9f68"/>
      <stop offset="1" stop-color="#7f2a1e"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#ffb07c"/>
      <stop offset="1" stop-color="#a63a2a"/>
    </linearGradient>
  </defs>

  <!-- backdrop disc so it reads on light and dark GitHub themes -->
  <circle cx="160" cy="160" r="152" fill="#1b1f27" stroke="#2f3541" stroke-width="4"/>

  <!-- ground -->
  <ellipse cx="160" cy="262" rx="112" ry="16" fill="#0e1116"/>
  <ellipse cx="160" cy="258" rx="104" ry="12" fill="#2a3040"/>

  <!-- shockwave ring -->
  <ellipse cx="160" cy="252" rx="86" ry="20" fill="none" stroke="url(#ring)" stroke-width="7" opacity=".9"/>

  <!-- stem -->
  <path d="M138 252 C130 220 124 190 134 150 L186 150 C196 190 190 220 182 252 Z" fill="url(#stem)" stroke="#3a1710" stroke-width="4" stroke-linejoin="round"/>

  <!-- cap: outline pass, then a seamless fill pass on top -->
  <g id="puffs">
    <circle cx="160" cy="112" r="62"/>
    <circle cx="104" cy="126" r="34"/>
    <circle cx="216" cy="126" r="34"/>
    <circle cx="124" cy="82" r="30"/>
    <circle cx="198" cy="80" r="30"/>
    <circle cx="160" cy="60" r="26"/>
  </g>
  <use href="#puffs" fill="none" stroke="#3a1710" stroke-width="8"/>
  <use href="#puffs" fill="url(#cap)"/>
  <!-- cap underside shadow -->
  <path d="M104 152 Q160 176 216 152" fill="none" stroke="#3a1710" stroke-width="4" stroke-linecap="round" opacity=".55"/>

  <!-- highlight -->
  <circle cx="118" cy="76" r="8" fill="#fff3c4" opacity=".85"/>
  <circle cx="106" cy="90" r="3.5" fill="#fff3c4" opacity=".7"/>

  <!-- the payload -->
  <text x="160" y="127" text-anchor="middle" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="800" font-size="40" fill="#1b1f27">⌘Q</text>

  <!-- tiny survivor: Finder, obviously -->
  <g transform="translate(236 226)">
    <rect x="0" y="0" width="22" height="22" rx="5" fill="#3aa0ff" stroke="#0e1116" stroke-width="2.5"/>
    <rect x="11" y="0" width="11" height="22" rx="5" fill="#ffffff" stroke="#0e1116" stroke-width="2.5"/>
    <rect x="0" y="0" width="22" height="22" rx="5" fill="none" stroke="#0e1116" stroke-width="2.5"/>
    <path d="M6 15 Q11 20 16 15" fill="none" stroke="#0e1116" stroke-width="2" stroke-linecap="round"/>
    <circle cx="7" cy="9" r="1.6" fill="#0e1116"/><circle cx="15" cy="9" r="1.6" fill="#0e1116"/>
  </g>
</svg>
