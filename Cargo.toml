[package]
name = "quitall"
version = "0.1.0"
edition = "2024"
description = "Quit all running macOS applications from the command line, with exclusions"
license = "MIT"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
libc = "0.2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "libc", "NSRunningApplication", "NSWorkspace"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSString"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"

[profile.release]
strip = true
lto = true
codegen-units = 1
